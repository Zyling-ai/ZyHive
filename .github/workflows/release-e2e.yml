name: Release E2E
run-name: Release candidate ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft release tag to validate and publish
        required: true
        type: string
      candidate_sha:
        description: Exact main commit used to build the draft assets
        required: true
        type: string
      release_id:
        description: Database ID of the existing private draft release
        required: true
        type: string
      previous_version:
        description: Previous stable release used by update tests
        required: false
        default: ''
        type: string

concurrency:
  group: release-hardening-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  supply-chain:
    name: SBOM, signing and provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact release tag checkout
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" = "true"
          test "$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.tag_name')" = "$VERSION"
          test "$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.target_commitish')" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git merge-base --is-ancestor HEAD origin/main
          scripts/verify-commit-identity.sh

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Download exact release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir dist
          for asset in \
            zyhive-linux-amd64 \
            zyhive-linux-arm64 \
            zyhive-darwin-amd64 \
            zyhive-darwin-arm64 \
            install.sh \
            SHA256SUMS; do
            gh release download "$VERSION" \
              --repo "$REPOSITORY" \
              --dir dist \
              --pattern "$asset"
          done
          bash scripts/release-supply-chain.sh verify-checksums dist

      - name: Rebuild and match exact tag assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          (
            cd ui
            npm ci
            npm test
            npm run build
          )
          rm -rf cmd/aipanel/ui_dist
          cp -R ui/dist cmd/aipanel/ui_dist
          git diff --no-index --quiet -- ui/dist cmd/aipanel/ui_dist

          mkdir rebuilt
          for platform in \
            "linux amd64" \
            "linux arm64" \
            "darwin amd64" \
            "darwin arm64"; do
            read -r goos goarch <<<"$platform"
            name="zyhive-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -buildvcs=false -trimpath -ldflags="-s -w -X main.Version=${VERSION}" \
              -o "rebuilt/$name" ./cmd/aipanel/
            cmp "rebuilt/$name" "dist/$name"
          done
          cmp scripts/install.sh dist/install.sh

      # 工具版本固定，升级必须经过仓库代码审查。
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6
        with:
          syft-version: v1.29.0

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.9.2
        with:
          cosign-release: v2.5.0

      - name: Generate SPDX SBOMs
        run: bash scripts/release-supply-chain.sh generate-sboms dist

      - name: Attest release assets and SBOMs
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/zyhive-linux-amd64
            dist/zyhive-linux-arm64
            dist/zyhive-darwin-amd64
            dist/zyhive-darwin-arm64
            dist/install.sh
            dist/SHA256SUMS
            dist/zyhive-linux-amd64.spdx.json
            dist/zyhive-linux-arm64.spdx.json
            dist/zyhive-darwin-amd64.spdx.json
            dist/zyhive-darwin-arm64.spdx.json
            dist/install.sh.spdx.json

      - name: Sign assets, checksums and SBOMs with OIDC
        run: bash scripts/release-supply-chain.sh sign dist

      - name: Verify generated supply-chain files
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          identity="https://github.com/${REPOSITORY}/.github/workflows/release-e2e.yml@refs/heads/main"
          bash scripts/release-supply-chain.sh verify dist "$identity"

      - name: Upload SBOMs and Sigstore bundles
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          gh release upload "$VERSION"
          dist/*.spdx.json
          dist/*.sigstore.json
          --repo "$REPOSITORY"
          --clobber

      - name: Redownload and verify draft candidate files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          rm -rf verified
          mkdir verified
          assets=(
            zyhive-linux-amd64
            zyhive-linux-arm64
            zyhive-darwin-amd64
            zyhive-darwin-arm64
            install.sh
          )
          signed=("${assets[@]}" SHA256SUMS "${assets[@]/%/.spdx.json}")
          for file in "${signed[@]}"; do
            gh release download "$VERSION" --repo "$REPOSITORY" --dir verified --pattern "$file"
            gh release download "$VERSION" --repo "$REPOSITORY" --dir verified --pattern "${file}.sigstore.json"
          done
          identity="https://github.com/${REPOSITORY}/.github/workflows/release-e2e.yml@refs/heads/main"
          bash scripts/release-supply-chain.sh verify verified "$identity"
          for file in "${signed[@]}"; do
            gh attestation verify "verified/$file" --repo "$REPOSITORY"
          done

      - name: Stage verified candidate for native runners
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: |
            dist/zyhive-linux-amd64
            dist/zyhive-linux-arm64
            dist/zyhive-darwin-amd64
            dist/zyhive-darwin-arm64
            dist/install.sh
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  candidate-install-update:
    name: Candidate install/update (${{ matrix.name }})
    needs: supply-chain
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: release-candidate-${{ inputs.version }}-${{ matrix.name }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: darwin-amd64
            os: macos-15-intel
          - name: darwin-arm64
            os: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true

      - name: Download verified candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ inputs.version }}
          path: dist

      - name: Prepare exact candidate and previous stable binary
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          BINARY: zyhive-${{ matrix.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x dist/zyhive-* dist/install.sh
          bash scripts/release-supply-chain.sh verify-checksums dist
          if [[ -n "$PREVIOUS_VERSION" ]]; then
            mkdir previous
            gh release download "$PREVIOUS_VERSION" \
              --repo "$REPOSITORY" \
              --dir previous \
              --pattern "$BINARY"
            cp "previous/$BINARY" "dist/previous-$BINARY"
          fi

      - name: Test candidate install, update, API and recovery journeys
        env:
          GH_TOKEN: ${{ github.token }}
          ZYHIVE_REPO: ${{ github.repository }}
        run: >-
          scripts/test/release-e2e/run.sh
          local
          "${{ inputs.version }}"
          dist
          "${{ inputs.previous_version }}"

  promote:
    name: Publish verified stable release
    needs: [supply-chain, candidate-install-update]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify candidate is still a draft at the expected commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.draft')" = "true"
          test "$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.tag_name')" = "$VERSION"
          target="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}" --jq '.target_commitish')"
          test "$target" = "$CANDIDATE_SHA"

      - name: Publish verified candidate
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: gh release edit "$VERSION" --repo "$REPOSITORY" --draft=false --latest
