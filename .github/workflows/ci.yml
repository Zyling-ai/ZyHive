name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity:
    name: Commit identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify sole Zyling-ai identity
        run: scripts/verify-commit-identity.sh

  go:
    name: Go (test / vet / build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -timeout=5m

      - name: go build
        run: go build ./...

  go-race:
    name: Go (race / critical packages)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true

      - name: Race detector
        run: >-
          go test -race -count=1 -timeout=10m
          ./internal/api
          ./pkg/artifact
          ./pkg/network
          ./pkg/safefs
          ./pkg/session
          ./pkg/tools

  lint-go:
    name: golangci-lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 首次接入：lint 只产生告警，不阻断 PR 合入；待存量清零后再改为 required check。
    # 用 --issues-exit-code=0 让 golangci-lint 始终 exit 0：issues 仍出现在
    # job log 里供审查，但 check 状态报告 SUCCESS，避免 GitHub 将 PR 标 UNSTABLE。
    # continue-on-error 保留作为双保险（万一 lint binary 自身 OOM 等）。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5
          args: --timeout=5m --issues-exit-code=0

  ui:
    name: UI (test / typecheck / build / embed)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify embedded UI is current
        run: git diff --no-index --exit-code -- dist ../cmd/aipanel/ui_dist

  scripts:
    name: Shell scripts (syntax)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: bash -n
        run: bash -n scripts/*.sh scripts/test/*.sh scripts/test/release-e2e/*.sh
      - name: Release supply-chain contracts
        run: bash scripts/test/release-supply-chain.sh

  release-smoke:
    name: Release E2E (install / API / update)
    needs: [go, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
      - name: Build native release fixture
        run: |
          mkdir -p /tmp/zyhive-release-smoke
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.Version=00.0.0v1" \
            -o /tmp/zyhive-release-smoke/zyhive-linux-amd64 \
            ./cmd/aipanel/
      - name: Test clean install, basic API and update
        run: scripts/test/release-e2e/run.sh local 00.0.0v1 /tmp/zyhive-release-smoke

  release-build:
    name: Release build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [identity, go, go-race, ui, scripts, release-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache: true
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          go build
          -ldflags "-X main.Version=${GITHUB_SHA::12}"
          -o "zyhive-${{ matrix.goos }}-${{ matrix.goarch }}"
          ./cmd/aipanel/
      - uses: actions/upload-artifact@v4
        with:
          name: zyhive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: zyhive-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
